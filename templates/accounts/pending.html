{% extends "base.html" %}
{% block title %}Awaiting approval · CHA{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-2xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
  <div class="text-4xl" aria-hidden="true">⏳</div>
  <h1 class="mt-3 text-2xl font-bold text-slate-900">Awaiting approval</h1>
  <p class="mt-2 text-slate-600">
    Your account ({{ user.get_role_display }}) has not yet been approved by an
    administrator. Please check back later.
  </p>
</div>
{% endblock %}
