{% extends "base.html" %}
{% block title %}Registration received · CHA{% endblock %}

{% block content %}
<div class="mx-auto max-w-md rounded-2xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
  <div class="text-4xl">📨</div>
  <h1 class="mt-3 text-2xl font-bold text-slate-900">Registration received</h1>
  <p class="mt-2 text-slate-600">
    Your account is awaiting acknowledgment from a Coruscant Health
    administrator. You'll be able to log in once approved.
  </p>
  <a href="{% url 'accounts:login' %}" class="mt-6 inline-block rounded-lg bg-slate-900 px-5 py-2 font-medium text-white hover:bg-slate-800">
    Go to log in
  </a>
</div>
{% endblock %}
